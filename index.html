<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตัวนับง่ายๆ</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f0f4f8;
      color: #222;
    }
    .card {
      background: #fff;
      padding: 32px 48px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    #count {
      font-size: 64px;
      font-weight: bold;
      margin: 16px 0;
    }
    button {
      font-size: 20px;
      padding: 8px 20px;
      margin: 0 4px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    #reset { background: #9ca3af; }
    #reset:hover { background: #6b7280; }
  </style>
</head>
<body>
  <div class="card">
    <h1>ตัวนับ</h1>
    <div id="count">0</div>
    <button id="minus">−</button>
    <button id="reset">รีเซ็ต</button>
    <button id="plus">+</button>
  </div>

  <script>
    let count = 0;
    const display = document.getElementById("count");

    function update() {
      display.textContent = count;
    }

    document.getElementById("plus").onclick = () => { count++; update(); };
    document.getElementById("minus").onclick = () => { count--; update(); };
    document.getElementById("reset").onclick = () => { count = 0; update(); };
  </script>
</body>
</html>
